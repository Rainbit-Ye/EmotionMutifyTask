# AAC 模型训练配置 — Llama-3-8B + DeepSpeed ZeRO-2

# 数据配置
data:
  train_data: "/home/user1/liuduanye/EmotionClassify/AAC2Text/data/processed/training_data.json"
  val_data: "/home/user1/liuduanye/EmotionClassify/AAC2Text/data/processed/val_data.json"
  num_train: null  # 训练数据数量，null表示全部
  val_ratio: 0.1   # 验证集比例

# 模型配置
model:
  base_model: "/home/user1/liuduanye/Meta-Llama-3-8B-Instruct"
  output_dir: "/home/user1/liuduanye/EmotionClassify/AAC2Text/checkpoints/aac_model"
  max_length: 128

# 训练配置 — 3卡 DeepSpeed
training:
  epochs: 3
  batch_size: 2           # 每卡2条, 2卡 × 2 = 4, × grad_accum 8 = 32 有效batch
  learning_rate: 2.0e-4   # LoRA 用更大的lr
  weight_decay: 0.01
  warmup_ratio: 0.05      # 用ratio替代固定steps，更灵活
  gradient_accumulation_steps: 8
  logging_steps: 50
  eval_steps: 200
  save_steps: 200
  save_total_limit: 3

# LoRA 配置 — 更高秩以获得更好的效果
lora:
  r: 32
  lora_alpha: 64
  lora_dropout: 0.05
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"

# 测试配置
test:
  test_samples:
    - ["I", "want_to", "water"]
    - ["I", "am", "happy"]
    - ["I", "eat_to", "apple"]
    - ["I", "go_to", "school"]
    - ["doctor", "help_to", "patient"]
    - ["I", "need_to", "medicine"]
