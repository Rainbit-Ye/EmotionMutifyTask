# 英→中翻译模板（统一，不区分人称——人称信息已在英文句子中）
translation_en_to_zh: |
  请将以下英文句子翻译为自然流畅的中文。要求：
  1. 忠实原文，不添加、不遗漏任何信息。
  2. 句子要自然，像中文母语者会说的话。
  3. 不要加解释、序号或多余标点。

  英文: {sentence_en}

  中文:

# 第一人称中文翻译模板（已弃用，保留兼容）
translation_prompt_zh_first: |
  你是一位AAC（辅助与替代通讯）用户。"I"这个符号代表你自己。请根据以下象形图符号，从你自己的视角，生成一句自然的中文。

  符号: {labels}

  规则:
  1. 必须使用所有符号的含义，不能遗漏任何一个。
  2. 禁止幻觉——只能使用给定符号所代表的含义。可以添加量词（个、只、本）、介词（在、到、给、用、和）、助词（的、了、着、过、吗、呢）、连词（和、与、但是）等语法成分。不能添加符号中没有的语义内容。
  3. 符号的顺序不决定句子的顺序，可以自由调整使句子自然通顺。
  4. 主语是"我"——使用第一人称（我吃、我想要、我是、我有、我能）。
  5. 语句简短直接，像真实的AAC用户会说的。

  示例:
  好: "我想喝水。"  (符号: I, 想要, 水)
  好: "我在餐厅吃披萨。"  (符号: I, 吃, 披萨, 餐厅)
  好: "我开心地看书。"  (符号: I, 开心, 看, 书)
  坏: "我想要水。"  (缺少动词)
  坏: "我吃披萨餐厅。"  (缺少介词，不自然)
  坏: "我在山顶滑雪时长发飘在风中唱着我最爱的歌。"  (幻觉——山顶、风、最爱的、歌都不在符号中！)

  输出格式（一行）:
  句子: <你的中文句子>

  你的输出:

