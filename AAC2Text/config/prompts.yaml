# 第三人称中文翻译模板
translation_prompt_zh_third: |
  你是一位AAC（辅助与替代通讯）翻译者。请根据以下象形图符号，生成一句自然的中文。

  符号: {labels}

  规则:
  1. 必须使用所有符号的含义，不能遗漏任何一个。
  2. 禁止幻觉——只能使用给定符号所代表的含义。可以添加量词、介词、助词、连词等语法成分。不能添加符号中没有的语义内容。
  3. 符号的顺序不决定句子的顺序，可以自由调整使句子自然通顺。
  4. 使用第三人称动词形式（他/她/它吃、医生帮助等）。
  5. 让句子听起来像自然的中文，不是机械的符号罗列。

  示例:
  好: "医生在医院帮助病人。"  (符号: 医生, 帮助, 病人, 医院)
  好: "兴奋的孩子在吃披萨。"  (符号: 孩子, 吃, 披萨, 兴奋)
  好: "老师在教室里看书。"  (符号: 老师, 看, 书, 教室)
  坏: "医生帮助病人医院。"  (缺少介词，不自然)
  坏: "园丁在早餐时间帮他梳头时还唱了首歌。"  (幻觉——唱了首歌不在符号中！)

  输出格式（一行）:
  句子: <你的中文句子>

  你的输出:

validation_agent:
  name: "CoT质量评估器"
  role: |
    量化评估AAC语料质量，结合CoT链式推理和纯计算指标。

    CoT评估维度（模型推理）:
    1. 语义连贯性 (Semantic Coherence): 标签能否构成连贯场景
    2. 语法自然度 (Grammatical Naturalness): 句子语法是否自然
    3. 标签融合度 (Label Integration): 标签是否自然融入句子
    4. 人称一致性 (Person Consistency): 主语与动词形式是否匹配

    纯计算维度:
    1. 标签覆盖率 (Coverage, w=0.25): 标签在句子中是否出现
    2. 公式化程度 (Formulaicness, w=0.15): 输出与输入结构的相似度（扣分项）

  validation_config:
    weights:
      naturalness: 0.40
      coverage: 0.25
      formulaicness: 0.15
    thresholds:
      accept: 0.55
      veto_coverage: 0.5

validation_cot_prompt: |
  You are a quality evaluator for AAC (Augmentative and Alternative Communication) text generation.
  Your task is to evaluate how natural the generated sentence is, given the input symbols.

  Input Symbols: {labels}
  Generated Sentence: {sentence}
  Subject Type: {subject_type}

  Rate this sentence on 5 dimensions. Be concise — write ONLY the score line for each dimension, no analysis text.

  1. Semantic Coherence (1=absurd, 5=perfectly natural scenario)
  2. Grammatical Naturalness (1=unnatural, 5=native-like)
  3. Label Integration (1=mechanical listing, 5=natural restructuring)
  4. Person Consistency (1=wrong agreement, 5=perfect agreement with subject type "{subject_type}")
  5. Overall Naturalness (1=unnatural, 5=perfectly natural)

  Output EXACTLY this format, one line per dimension, nothing else:
  Semantic Coherence: <1-5>
  Grammatical Naturalness: <1-5>
  Label Integration: <1-5>
  Person Consistency: <1-5>
  Overall Naturalness: <1-5>

  Your output:
